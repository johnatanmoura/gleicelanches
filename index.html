<title>Pague com Pix</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #eebfc9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 340px;
    width: 100%;
    text-align: center;
    background: #faf1e6;
    border-radius: 20px;
    padding: 32px 24px;
    border: 1px solid #e3c9c9;
  }
  .logo {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 20px;
    display: block;
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    color: #6d4c4c;
    margin-bottom: 24px;
  }
  .chave-box {
    border: 1px solid #e3c9c9;
    background: #ffffff;
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 16px;
    color: #6d4c4c;
    margin-bottom: 16px;
    letter-spacing: 0.02em;
    font-family: ui-monospace, monospace;
  }
  button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    background: #a3697a;
    color: #fff;
    transition: background 0.15s;
  }
  button.copiado { background: #8a5468; }
  .aviso {
    font-size: 12px;
    color: #b09090;
    margin-top: 18px;
  }
</style>

<script>
const NOME_BENEFICIARIO = "Maria Gleiciane Gomes da Silva";
const CHAVE_PIX = "85991942860";
const CHAVE_PIX_EXIBICAO = "(85) 99194-2860";

document.getElementById('nomeExibido').textContent = NOME_BENEFICIARIO;
document.getElementById('chaveExibida').textContent = CHAVE_PIX_EXIBICAO;

function copiarChave() {
  navigator.clipboard.writeText(CHAVE_PIX).then(() => {
    const btn = document.getElementById('btnCopiar');
    btn.textContent = "Chave copiada!";
    btn.classList.add('copiado');
    setTimeout(() => {
      btn.textContent = "Copiar chave Pix";
      btn.classList.remove('copiado');
    }, 2000);
  });
}
</script>
